name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Typecheck (web + packages)
        run: pnpm --filter @hris/web --filter "./packages/*" typecheck
      - name: Unit tests (no DB)
        run: |
          pnpm --filter @hris/shared test
          cd apps/web && node --test "src/**/*.test.mjs"
