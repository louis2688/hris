name: DB backup

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    container: postgres:17 # pg_dump 17 can dump any server up to Postgres 17 (Supabase)
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          [ -n "$BACKUP_DATABASE_URL" ] || { echo "::error::BACKUP_DATABASE_URL secret is not set"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1; }

      - name: Install gpg
        run: apt-get update -qq && apt-get install -y -qq gnupg >/dev/null

      - name: Dump and encrypt
        id: dump
        run: |
          set -euo pipefail
          name="hris-db-$(date -u +%Y-%m-%d)"
          mkdir -p out
          # public only: the app lives there; Supabase-managed schemas (auth, storage...) cannot be restored with --clean anyway
          pg_dump --format=custom --no-owner --no-privileges --schema=public "$BACKUP_DATABASE_URL" > "out/$name.dump"
          [ -s "out/$name.dump" ] || { echo "::error::pg_dump produced an empty file"; exit 1; }
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "out/$name.dump.gpg" "out/$name.dump"
          rm "out/$name.dump"
          ls -lh out
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: out/${{ steps.dump.outputs.name }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
